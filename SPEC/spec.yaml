project_name: "awg-ctl"
description: "Service CLI utility for managing a 3-server AmneziaWG cascade"

mvp:
  commands:
    - check
  out_of_scope:
    - clients
    - swap-exit
    - test-failover
    - deploy

configuration:
  source: "cascade.yaml"
  location_priority:
    - "--config <path> CLI flag"
    - "AWG_CTL_CONFIG env var"
    - "./cascade.yaml"
    - "/etc/awg-ctl/cascade.yaml"
  sections:
    - servers: "in, mid, out — host, port, username"
    - network: "subnets, mtu, mss_clamp, keepalive, dns, ip_checker_url"
    - sysctl: "kernel parameters (rp_filter, ip_forward, conntrack, ipv6)"
    - ports: "client_in, link1, link2, mobile"
    - scripts: "manage_amneziawg, routing, backup_prefixes"
    - timeouts: "ssh_connect, ssh_command, deploy, check"
    - log_level: "debug|info|warning|error"
  secrets:
    handling: "Not in cascade.yaml — SSH keys in ~/.ssh/, RejectPolicy host key verification"
    file_permissions: "chmod 600 cascade.yaml; chmod 600 ~/.ssh/id_ed25519_awg"
  validation:
    rules:
      - "All three servers (in, mid, out) required"
      - "Subnets must not overlap"
      - "ip_checker_url must start with http"
      - "keepalive 0-120 seconds"

phase_2:
  title: "Phase 2 / Post-MVP (Out of Scope for v1)"
  check:
    description: "Read-only cascade check and E2E probe"
    flags:
      --json: "Strict JSON output on stdout; human report on stdout; logs to stderr."
      --color: "Colour mode: auto (default), always, never. Supports NO_COLOR env var."
      --verbose: "Verbose output with detailed diagnostics."
    schema: "awg-ctl/check/v1"
    status_values: ["pass", "fail", "warning"]
    exit_codes:
      0: "OK (pass)"
      1: "CRITICAL (fail)"
      3: "WARNING"
      64: "USAGE_ERROR"
    priority_matrix: "1 (CRITICAL) > 3 (WARNING) > 0 (OK)"
    e2e_probes: true
    fail_closed_audit: true
  menu:
    description: "Interactive TTY menu for awg-ctl"
    options:
      --interactive: "Launch interactive menu (requires TTY and questionary)."
    items:
      - check
      - clients
      - swap-exit
      - test-failover
  deploy:
    description: "Deploy cascade configuration to all nodes"
    options:
      --dry-run: "Show what would be deployed without applying changes."
    pre_deploy:
      backups: true
      description: "Create backups before deployment."
  swap-exit:
    description: "Swap exit node"
    options:
      --new-host: "New exit node host."
  test-failover:
    description: "Test failover"
    options:
      --target: "Target node: mid or out."
      --wait-healthcheck: "Wait for healthcheck after failover."
  clients:
    description: "Client management"
    subcommands:
      - add
      - remove
      - list

components:
  - name: "awg_cascade_ctl"
    type: api
    version: "0.1.0"
    authors:
      - "oleg1981ekb-ai"
    requirements: {}
