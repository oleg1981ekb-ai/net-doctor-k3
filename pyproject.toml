[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "awg-cascade-ctl"
version = "0.1.0"
description="Service CLI utility awg-ctl for managing 3-server AmneziaWG cascade (v3.1 / v2.0)"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "fabric>=3.2",
  "pydantic>=2.7",
  "pyyaml>=6",
]

[project.scripts]
awg-ctl = "awg_cascade_ctl.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
